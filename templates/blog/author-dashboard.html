<h1>My Posts</h1>

{% if posts %}
    <ul>
        {% for post in posts %}
            <li>
                <strong>{{ post.title }}</strong>
                <br>
                Published: {{ post.publish_date }}
                <br>
                <a href="#">
                    Edit
                </a>
                |
                <a href="#">
                    Delete
                </a>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>You haven't created any posts yet.</p>
{% endif %}
