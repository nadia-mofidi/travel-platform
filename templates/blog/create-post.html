
{% extends 'base.html' %}
{% load static %}

{% block content %}

<!-- start banner Area -->
<section class="relative about-banner">
    <div class="overlay overlay-bg"></div>

    <div class="container">
        <div class="row d-flex align-items-center justify-content-center">

            <div class="about-content col-lg-12">
                <h1 class="text-white">
                    Create New Post
                </h1>

                <p class="text-white link-nav">
                    <a href="{% url 'blog:index' %}">Home</a>
                    <span class="lnr lnr-arrow-right"></span>
                    Create New Post
                </p>
            </div>

        </div>
    </div>
</section>
<!-- End banner Area -->


<!-- Start Create Post Area -->
<section class="contact-page-area section-gap">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-10">

                <h3 class="mb-30">
                    Create New Post
                </h3>

                <form class="form-area contact-form"method="post"enctype="multipart/form-data">

                    {% csrf_token %}

                    <div class="row">

                        <!-- LEFT COLUMN -->
                        <div class="col-lg-6 form-group">

                            <!-- Title -->
                            <input
                                name="title"
                                placeholder="Post Title"
                                onfocus="this.placeholder = ''"
                                onblur="this.placeholder = 'Post Title'"
                                class="common-input mb-20 form-control"
                                required
                                type="text"
                            >


                            <!-- Image -->
                            <input
                                name="image"
                                class="common-input mb-20 form-control"
                                type="file"
                            >


                            <!-- Tags -->
                            <input
                                name="tags"
                                placeholder="Tags (travel, adventure, nature...)"
                                onfocus="this.placeholder = ''"
                                onblur="this.placeholder = 'Tags (travel, adventure, nature...)'"
                                class="common-input mb-20 form-control"
                                type="text"
                            >


                            <!-- Publish Date -->
                            <input
                                name="publish_date"
                                class="common-input mb-20 form-control"
                                type="datetime-local"
                            >

                        </div>


                        <!-- RIGHT COLUMN -->
                        <div class="col-lg-6 form-group">

                            <!-- Content -->
                            <textarea
                                class="common-textarea form-control"
                                name="content"
                                placeholder="Write your travel story..."
                                onfocus="this.placeholder = ''"
                                onblur="this.placeholder = 'Write your travel story...'"
                                required
                            ></textarea>

                        </div>


                        <!-- CATEGORY -->
                        <div class="col-lg-12 form-group">

                            <label class="mb-10">
                                Category
                            </label>
                        
                            <select
                                name="category"
                                class="common-input form-control"
                                multiple
                                required
                                style="height: 120px;"
                            >
                        
                                {% for category in form.fields.category.queryset %}
                        
                                    <option value="{{ category.id }}">
                                        {{ category.name }}
                                    </option>
                                
                                {% endfor %}
                                
                            </select>

                        </div>
                        

                        <!-- OPTIONS -->
                    <div class="col-lg-12 form-group">

                        <div class="row">
                            
                            <div class="col-lg-6">
                                <div class="switch-wrap d-flex align-items-center">
                                    
                                        <p class="mb-0 mr-20">Require Login to Read</p>
                                    
                                    <div class="primary-checkbox">
                                        <input type="checkbox"
                                        name="login_require"
                                        id="login_require">
                                        <label for="login_require"></label>
                                    </div>

                                </div>
                            </div>

                            <div class="col-lg-6">
                                <div class="switch-wrap d-flex align-items-center">

                                    <p class="mb-0 mr-20">Publish Post</p>

                                    <div class="primary-checkbox">
                                        <input type="checkbox"
                                               name="status"
                                               id="status">
                                        <label for="status"></label>
                                    </div>

                                </div>
                            </div>

                        </div>

                    </div>


                        <!-- BUTTON -->
                        <div class="col-lg-12">

                            <div class="text-right">

                                <a href="{% url 'blog:dashboard' %}"
                                   class="genric-btn primary-border">
                                    Cancel
                                </a>

                                <button type="submit"
                                        class="genric-btn primary">
                                    Publish Post
                                </button>

                            </div>

                        </div>

                    </div>

                </form>

            </div>

        </div>

    </div>

</section>
<!-- End Create Post Area -->

{% endblock %}
